name: praktikum_gps
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  provider: ^6.1.2
  geolocator: ^10.0.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/profile.png
    - assets/icon_app.jpeg

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon_app.jpeg"
